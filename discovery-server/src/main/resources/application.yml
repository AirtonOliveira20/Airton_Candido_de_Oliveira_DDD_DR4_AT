server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: discovery-server

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    wait-time-in-ms-when-sync-empty: 0

management:
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
    propagation:
      type: W3C
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    name: ${LOG_DIR:./logs}/${spring.application.name}.json
  structured:
    format:
      file: ecs
      console: ecs
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
      total-size-cap: 200MB
  level:
    org.hibernate.orm.jdbc.bind: "OFF"
    org.springframework.web: WARN

graylog:
  host: ${GRAYLOG_HOST:localhost}
  port: ${GRAYLOG_PORT:12201}
