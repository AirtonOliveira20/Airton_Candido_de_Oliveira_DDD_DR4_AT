server:
  port: ${SERVER_PORT:8081}

spring:
  temporal:
    namespace: default
    connection:
      target: ${TEMPORAL_TARGET:localhost:7233}
    workers:
      - task-queue: cinepass-reserva
    workers-auto-discovery:
      enabled: true
      workflow-packages:
        - br.com.cinepass.reserva.infrastructure.temporal.workflow
  application:
    name: reserva-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:25432/cinepass_db}
    username: ${DB_USERNAME:cinepass}
    password: ${DB_PASSWORD:cinepass}
  kafka:
    template:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        max.block.ms: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
    propagation:
      type: W3C
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info

cinepass:
  kafka:
    topico-reservas: cinepass.reserva.eventos
    particoes: 3
  outbox:
    intervalo-ms: 500

logging:
  file:
    name: ${LOG_DIR:./logs}/${spring.application.name}.json
  structured:
    format:
      file: ecs
      console: ecs
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
      total-size-cap: 200MB
  level:
    org.hibernate.orm.jdbc.bind: "OFF"
    org.springframework.web: WARN

graylog:
  host: ${GRAYLOG_HOST:localhost}
  port: ${GRAYLOG_PORT:12201}
