server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: reserva-service
              uri: lb://RESERVA-SERVICE
              predicates:
                - Path=/api/reservas/**,/api/filmes/**,/api/sessoes/**
            - id: pagamento-service
              uri: lb://PAGAMENTO-SERVICE
              predicates:
                - Path=/api/pagamentos/**
            - id: ingresso-service
              uri: lb://INGRESSO-SERVICE
              predicates:
                - Path=/api/ingressos/**
            - id: notificacao-service
              uri: lb://NOTIFICACAO-SERVICE
              predicates:
                - Path=/api/notificacoes/**
            - id: historico-service
              uri: lb://HISTORICO-SERVICE
              predicates:
                - Path=/api/historico/**
            - id: auditoria-service
              uri: lb://AUDITORIA-SERVICE
              predicates:
                - Path=/api/auditoria/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
    propagation:
      type: W3C
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  file:
    name: ${LOG_DIR:./logs}/${spring.application.name}.json
  structured:
    format:
      file: ecs
      console: ecs
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
      total-size-cap: 200MB
  level:
    org.hibernate.orm.jdbc.bind: "OFF"
    org.springframework.web: WARN

graylog:
  host: ${GRAYLOG_HOST:localhost}
  port: ${GRAYLOG_PORT:12201}
